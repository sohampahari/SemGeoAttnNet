name: sem_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8
  - pip:
    - diffusers==0.21.4
    - transformers==4.34.1
    - opencv-python==4.8.1.78
    - pillow
    - trimesh==4.0.0
    - einops==0.7.0
    - scipy
    - numpy
    - safetensors
    - huggingface_hub
    - accelerate
    - fvcore
    - iopath
